<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieHub</title>
<style>
:root{--bg:#050b10;--panel:#101922;--text:#f5f7fa;--muted:#9da8b3;--accent:#f20d2f;--line:#24303a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:10;background:rgba(5,11,16,.95);border-bottom:1px solid var(--line)}
.logo{font-size:28px;font-weight:900}.logo span{color:var(--accent)}
button{border:0;background:none;color:inherit;cursor:pointer}
.icon{font-size:25px}
.hero{min-height:420px;padding:80px 5%;display:flex;align-items:end;background:linear-gradient(90deg,#050b10 20%,rgba(5,11,16,.55),rgba(5,11,16,.1)),linear-gradient(0deg,#050b10,transparent),url("https://image.tmdb.org/t/p/original/") center/cover}
.hero-inner{max-width:650px}.eyebrow{letter-spacing:4px;color:#cbd3da;font-weight:800}
h1{font-size:clamp(42px,8vw,78px);line-height:.95;margin:15px 0}.hero p{font-size:18px;color:#cbd3da;line-height:1.5}
.search{margin:25px 5%;display:flex;background:var(--panel);border:1px solid #34424d;border-radius:18px;overflow:hidden}
.search input{flex:1;background:none;border:0;outline:0;color:white;padding:18px;font-size:17px}.search button{padding:0 20px}
main{padding:0 5% 60px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 15px}.section-head h2{font-size:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px}
.card{min-width:0}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#17212a;display:block}.title{font-weight:700;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:13px;margin-top:5px}
.status{text-align:center;color:var(--muted);padding:35px}
footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:380px;padding-bottom:40px}}
</style>
</head>
<body>
<header>
  <div class="logo">MOVIE<span>HUB</span></div>
  <button class="icon" onclick="document.getElementById('search').focus()">⌕</button>
</header>

<section class="hero" id="hero">
  <div class="hero-inner">
    <div class="eyebrow">MOVIES • SERIES • MORE</div>
    <h1>DISCOVER YOUR NEXT <span style="color:var(--accent)">MOVIE</span></h1>
    <p>Explore movies you'll love.</p>
  </div>
</section>

<div class="search">
  <input id="search" type="search" placeholder="Search movies, actors & genres">
  <button onclick="searchMovies()">🔍</button>
</div>

<main>
  <div id="message" class="status">Loading movies…</div>

  <section id="resultsSection" style="display:none">
    <div class="section-head"><h2>Search Results</h2></div>
    <div id="results" class="grid"></div>
  </section>

  <section>
    <div class="section-head"><h2>🔥 Trending Movies</h2></div>
    <div id="trending" class="grid"></div>
  </section>

  <section>
    <div class="section-head"><h2>⭐ Popular Movies</h2></div>
    <div id="popular" class="grid"></div>
  </section>
</main>

<footer>MovieHub • Powered by TMDB</footer>

<script>
/*
  MOVIEHUB API SETUP
  Replace ONLY the text between the quotation marks below.
*/
		const TMDB_API_KEY = "780071a02b653837b3b76b1e0b4e1fb9";

const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

function apiUrl(path, params={}) {
  const q = new URLSearchParams({api_key: TMDB_API_KEY, language:"en-US", ...params});
  return API + path + "?" + q.toString();
}

function card(movie){
  const poster = movie.poster_path ? IMG + movie.poster_path : "";
  const title = movie.title || movie.name || "Untitled";
  const year = (movie.release_date || movie.first_air_date || "").slice(0,4) || "—";
  const rating = movie.vote_average ? movie.vote_average.toFixed(1) : "—";
  return `<article class="card">
    ${poster ? `<img class="poster" src="${poster}" alt="">` : `<div class="poster"></div>`}
    <div class="title">${escapeHtml(title)}</div>
    <div class="meta">${year} • ⭐ ${rating}</div>
  </article>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function load(){
  if(TMDB_API_KEY === "PASTE_YOUR_TMDB_API_KEY_HERE"){
    document.getElementById("message").innerHTML =
      "Your MovieHub page is ready. Open this file in Kodex and replace the API-key placeholder.";
    return;
  }
  try{
    const [tr,pop] = await Promise.all([
      fetch(apiUrl("/trending/movie/week")).then(r=>r.json()),
      fetch(apiUrl("/movie/popular")).then(r=>r.json())
    ]);
    if(tr.status_code || pop.status_code) throw new Error(tr.status_message || pop.status_message || "TMDB error");
    document.getElementById("trending").innerHTML = (tr.results||[]).slice(0,12).map(card).join("");
    document.getElementById("popular").innerHTML = (pop.results||[]).slice(0,12).map(card).join("");
    document.getElementById("message").style.display="none";
  }catch(e){
    document.getElementById("message").textContent="TMDB could not be reached. Check your API key and internet connection.";
  }
}

async function searchMovies(){
  const term=document.getElementById("search").value.trim();
  if(!term) return;
  document.getElementById("resultsSection").style.display="block";
  document.getElementById("results").innerHTML='<div class="status">Searching…</div>';
  try{
    const data=await fetch(apiUrl("/search/movie",{query:term,include_adult:"false"})).then(r=>r.json());
    if(data.status_code) throw new Error(data.status_message);
    document.getElementById("results").innerHTML=(data.results||[]).slice(0,20).map(card).join("") || '<div class="status">No movies found.</div>';
  }catch(e){
    document.getElementById("results").innerHTML='<div class="status">Search failed. Check your API key.</div>';
  }
}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")searchMovies()});
load();
</script>
</body>
</html>
