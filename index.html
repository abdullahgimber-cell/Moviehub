<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MovieHub</title><style>
body{margin:0;background:#050b10;color:#fff;font-family:Arial,sans-serif}header{padding:18px 5%;display:flex;justify-content:space-between;background:#0a1219;position:sticky;top:0}.logo{font-size:28px;font-weight:900}.logo span{color:#f20d2f}button{border:0;border-radius:9px;padding:10px 14px;background:#f20d2f;color:#fff;font-weight:700}nav button{background:transparent}.search{margin:24px 5%;display:flex;background:#111c25;border:1px solid #34424d;border-radius:14px;overflow:hidden}.search input{flex:1;padding:16px;background:transparent;border:0;color:#fff;outline:0}.search button{border-radius:0}.hero{padding:70px 5%;background:linear-gradient(90deg,#050b10,#050b1088);}.hero h1{font-size:clamp(40px,8vw,70px)}section{padding:0 5%;margin:30px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#17212a;border-radius:12px}.title{font-weight:700;margin-top:8px}.meta{color:#9da8b3;font-size:12px;margin:5px 0}.watch{width:100%;margin-top:6px}.player{display:none;padding:0 5%;}.player video{width:100%;max-height:65vh;background:#000;border-radius:12px}.note{color:#9da8b3;font-size:13px;line-height:1.5}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header><div class="logo">MOVIE<span>HUB</span></div><nav><button onclick="home()">Home</button><button onclick="free()">Free Movies</button></nav></header>
<div class="hero"><h1>DISCOVER YOUR NEXT <span style="color:#f20d2f">MOVIE</span></h1><p>Search TMDB and watch selected legally available films.</p></div>
<div class="search"><input id="q" placeholder="Search movies"><button onclick="searchMovies()">🔍</button></div>
<div id="player" class="player"><video id="video" controls playsinline></video><p id="playing"></p><button onclick="closePlayer()">Close player</button></div>
<section id="home"><h2>🔥 Trending Movies</h2><div id="trending" class="grid"></div><h2>⭐ Popular Movies</h2><div id="popular" class="grid"></div></section>
<section id="results" class="hidden"><h2>Search Results</h2><div id="resultGrid" class="grid"></div></section>
<section id="freeMovies" class="hidden"><h2>🎬 Free Legal Movies</h2><p class="note">Only titles whose source permits free viewing are included. Availability can vary by region.</p><div id="freeGrid" class="grid"></div></section>
<script>
const TMDB_API_KEY="780071a02b653837b3b76b1e0b4e1fb9";
const API="https://api.themoviedb.org/3",IMG="https://image.tmdb.org/t/p/w500";
const freeList=[
{title:"His Girl Friday",year:"1940",poster:"https://archive.org/download/his_girl_friday/his_girl_friday.jpg",video:"https://archive.org/download/his_girl_friday/his_girl_friday_512kb.mp4"},
{title:"The General",year:"1926",poster:"https://archive.org/download/TheGeneral1926/TheGeneral1926.jpg",video:"https://archive.org/download/TheGeneral1926/TheGeneral1926_512kb.mp4"}];
function url(p,x={}){return API+p+"?"+new URLSearchParams({api_key:TMDB_API_KEY,language:"en-US",...x})}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(m){let p=m.poster_path?IMG+m.poster_path:"";return `<article><img class="poster" src="${p}" alt=""><div class="title">${esc(m.title||m.name)}</div><div class="meta">${(m.release_date||"").slice(0,4)} • ⭐ ${(m.vote_average||0).toFixed(1)}</div></article>`}
async function load(){if(TMDB_API_KEY.includes("PASTE_"))return;try{let [a,b]=await Promise.all([fetch(url("/trending/movie/week")).then(r=>r.json()),fetch(url("/movie/popular")).then(r=>r.json())]);trending.innerHTML=a.results.slice(0,12).map(card).join("");popular.innerHTML=b.results.slice(0,12).map(card).join("")}catch(e){trending.innerHTML="<p>TMDB could not be reached.</p>"}}
async function searchMovies(){let qv=q.value.trim();if(!qv)return;homeSection(false);results.classList.remove("hidden");let d=await fetch(url("/search/movie",{query:qv,include_adult:"false"})).then(r=>r.json());resultGrid.innerHTML=(d.results||[]).slice(0,20).map(card).join("")||"<p>No movies found.</p>"}
function homeSection(v){home.classList.toggle("hidden",!v);results.classList.toggle("hidden",v);freeMovies.classList.add("hidden")}
function home(){homeSection(true)}
function free(){home.classList.add("hidden");results.classList.add("hidden");freeMovies.classList.remove("hidden");freeGrid.innerHTML=freeList.map((m,i)=>`<article><img class="poster" src="${m.poster}" alt=""><div class="title">${esc(m.title)}</div><div class="meta">${m.year} • Legal/free source</div><button class="watch" onclick="play(${i})">▶ Watch</button></article>`).join("")}
function play(i){const m=freeList[i];video.pause();video.src=m.video;video.load();playing.textContent="Now playing: "+m.title;player.style.display="block";player.scrollIntoView({behavior:"smooth",block:"start"});}
function closePlayer(){video.pause();video.removeAttribute("src");video.load();player.style.display="none"}
q.addEventListener("keydown",e=>{if(e.key==="Enter")searchMovies()});load();
</script></body></html>
